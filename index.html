<title>Владимир Медин</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Design Plan: Modern tech-focused personal card with dark theme, gradient accents, smooth animations */

  :root {
    --bg-dark: #0a0a0a;
    --bg-card: #1a1a1a;
    --text-primary: #ffffff;
    --text-secondary: #b0b0b0;
    --accent-1: #00d4ff;
    --accent-2: #7c3aed;
    --accent-gradient: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
    --glow-color: rgba(0, 212, 255, 0.3);

    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid rgba(0, 212, 255, 0.1);
    border-radius: 24px;
    padding: 60px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    animation: slideUp 0.6s ease-out;
  }

  .card:hover {
    border-color: rgba(0, 212, 255, 0.2);
    box-shadow: 0 16px 48px rgba(0, 212, 255, 0.15);
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .avatar {
    width: 100px;
    height: 100px;
    margin: 0 auto 30px;
    background: var(--accent-gradient);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: bold;
    box-shadow: 0 0 30px var(--glow-color);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 30px var(--glow-color);
    }
    50% {
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.4);
    }
  }

  .name {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 12px;
    background: var(--accent-gradient);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px var(--glow-color);
    letter-spacing: -0.5px;
    animation: glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% {
      filter: drop-shadow(0 0 10px var(--glow-color));
    }
    50% {
      filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.4));
    }
  }

  .role {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .title {
    font-size: 1.1rem;
    color: var(--accent-1);
    margin-bottom: 30px;
    font-weight: 500;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: var(--accent-gradient);
    margin: 30px auto;
    border-radius: 2px;
    opacity: 0.6;
  }

  .contact-info {
    margin: 30px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 0.95rem;
    color: var(--text-secondary);
    transition: all 0.3s ease;
  }

  .contact-item:hover {
    color: var(--accent-1);
    transform: translateX(4px);
  }

  .telegram-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-gradient);
    border-radius: 50%;
    color: white;
    font-weight: bold;
    font-size: 12px;
  }

  .email-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cta-button {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 40px;
    background: var(--accent-gradient);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
    letter-spacing: 0.3px;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
  }

  .cta-button:hover::before {
    left: 100%;
  }

  .cta-button:active {
    transform: translateY(0);
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
  }

  .social-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(0, 212, 255, 0.2);
    border-radius: 50%;
    color: var(--text-secondary);
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 20px;
  }

  .social-icon:hover {
    border-color: var(--accent-1);
    color: var(--accent-1);
    background: rgba(0, 212, 255, 0.1);
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0, 212, 255, 0.2);
  }

  .footer-note {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    body {
      padding-block: 20px;
    }

    .card {
      padding: 40px 24px;
      border-radius: 16px;
    }

    .name {
      font-size: 2rem;
    }

    .avatar {
      width: 80px;
      height: 80px;
      font-size: 40px;
    }

    .title {
      font-size: 1rem;
    }
  }
</style>

<div class="card">
  <div class="avatar">ВМ</div>

  <h1 class="name">Владимир Медин</h1>

  <div class="role">Технолог</div>
  <div class="title">Разработчик эффективного интеллекта</div>

  <div class="divider"></div>

  <div class="contact-info">
    <div class="contact-item">
      <div class="telegram-icon">✈</div>
      <span>@territoriya_zdorovya1</span>
    </div>
    <div class="contact-item">
      <div class="email-icon">📧</div>
      <span>vmedin2019@gmail.com</span>
    </div>
  </div>

  <button class="cta-button" onclick="openTelegram()">Написать мне</button>

  <div class="social-links">
    <a class="social-icon" href="https://t.me/territoriya_zdorovya1" target="_blank" title="Telegram">
      💬
    </a>
    <a class="social-icon" href="mailto:vmedin2019@gmail.com" title="Email">
      📧
    </a>
  </div>

  <div class="footer-note">
    Всегда открыт к новым идеям и сотрудничеству
  </div>
</div>

<script>
  function openTelegram() {
    const telegramUrl = 'https://t.me/territoriya_zdorovya1';
    window.open(telegramUrl, '_blank');
  }

  // Handle button ripple effect on click
  document.querySelector('.cta-button').addEventListener('click', function(e) {
    const ripple = document.createElement('span');
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    ripple.style.cssText = `
      position: absolute;
      width: ${size}px;
      height: ${size}px;
      left: ${x}px;
      top: ${y}px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      animation: rippleEffect 0.6s ease-out;
    `;

    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  const style = document.createElement('style');
  style.textContent = `
    @keyframes rippleEffect {
      from {
        transform: scale(0);
        opacity: 1;
      }
      to {
        transform: scale(1);
        opacity: 0;
      }
    }
  `;
  document.head.appendChild(style);
</script>
